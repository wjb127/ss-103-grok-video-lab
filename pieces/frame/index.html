<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>틀</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: ui-sans-serif, system-ui, sans-serif;
      color: #fff;
      background: #111;
    }
    .bg, video {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .bg {
      background:
        radial-gradient(900px 500px at 20% 20%, rgba(255,255,255,.16), transparent 55%),
        linear-gradient(160deg, #1a1c24, #0c0d12 60%, #1b2430);
    }
    video { display: none; }
    video.on { display: block; }
    .shade {
      position: fixed; inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,.55), rgba(0,0,0,.15) 70%);
    }
    .copy {
      position: relative; z-index: 2;
      min-height: 100%;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 12vh 8vw 10vh;
      max-width: 920px;
    }
    a.back {
      position: fixed; top: 16px; left: 18px; z-index: 3;
      color: rgba(255,255,255,.72); font-size: 12px; text-decoration: none;
    }
    h1 {
      margin: 0;
      font-size: clamp(40px, 6vw, 76px);
      font-weight: 560;
      letter-spacing: -0.045em;
      line-height: 1.05;
    }
    p {
      margin: 16px 0 0;
      max-width: 36ch;
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.45;
      color: rgba(255,255,255,.82);
    }
  </style>
</head>
<body>
  <a class="back" href="../../">← 목록</a>
  <div class="bg" aria-hidden="true"></div>
  <video id="bgv" autoplay muted loop playsinline></video>
  <div class="shade" aria-hidden="true"></div>
  <div class="copy">
    <h1>히어로 문구</h1>
    <p>한 줄 설명이 여기 들어간다.</p>
  </div>
  <script>
    const v = document.getElementById("bgv");
    const src = v.dataset.src || "";
    if (src) {
      v.src = src;
      v.classList.add("on");
      v.play().catch(() => {});
    }
  </script>
</body>
</html>
