<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>grok video lab</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0b0c; --fg:#ededed; --mut:#8a8a8e; --line:#222; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 720px; margin: 0 auto; padding: 56px 24px 80px; }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.03em; margin: 0 0 8px; }
    .lede { color: var(--mut); font-size: 14px; margin: 0 0 36px; }
    a.piece {
      display: flex; justify-content: space-between; gap: 16px;
      padding: 14px 0; border-top: 1px solid var(--line);
      text-decoration: none; color: inherit;
    }
    a.piece:last-child { border-bottom: 1px solid var(--line); }
    a.piece strong { font-weight: 550; }
    a.piece span { color: var(--mut); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>grok video lab</h1>
    <p class="lede">히어로 문구 + 배경 영상. 한 조합이 링크 하나.</p>
    <a class="piece" href="pieces/frame/">
      <strong>틀</strong>
      <span>문구 자리 · 배경 영상 자리</span>
    </a>
  </main>
</body>
</html>
